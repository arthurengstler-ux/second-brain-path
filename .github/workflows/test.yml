name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS runners are scarce on GitHub, so macOS gets one job; Python 3.9 (the macOS system
        # Python) is covered on Windows and locally
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
        include:
          - os: windows-latest
            python: "3.9"
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: git identity (setup_vault makes a first commit)
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
      - name: smoke test
        run: python -I tests/smoke_test.py
