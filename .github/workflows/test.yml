name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
        include:
          # macOS ships Python 3.9 with the command line tools, so test it there and on Windows
          - os: macos-latest
            python: "3.9"
          - os: windows-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: git identity (setup_vault makes a first commit)
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
      - name: smoke test
        run: python -I tests/smoke_test.py
